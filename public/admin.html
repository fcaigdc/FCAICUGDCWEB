<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Panel - FCAI CUGD Club">
    <title>Admin Panel - FCAI CUGD Club</title>
    <link rel="stylesheet" href="/css/style.css?v=1.0">
    <link rel="stylesheet" href="/css/admin.css?v=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="admin-page">
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="sidebar-header">
                <img src="/assets/images/omar.webp" alt="Logo" 
                     onerror="this.src='/assets/images/logo.png'"
                     style="width:36px; height:36px; object-fit:contain; border-radius:0; border:none;">
                <span>Admin Panel</span>
                <button class="theme-toggle" id="theme-toggle" style="margin-left: auto; background: none; border: none; color: var(--text-color); cursor: pointer; font-size: 1.1rem;">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active" data-section="statistics">
                    <i class="fas fa-chart-bar"></i> Statistics
                </a>
                <a href="#" class="sidebar-link" data-section="team">
                    <i class="fas fa-users"></i> Team Members
                </a>
                <a href="#" class="sidebar-link" data-section="youtube">
                    <i class="fab fa-youtube"></i> YouTube Videos
                </a>
                <a href="#" class="sidebar-link" data-section="partners">
                    <i class="fas fa-handshake"></i> Partners
                </a>
                <a href="#" class="sidebar-link" data-section="community-games">
                    <i class="fas fa-gamepad"></i> Community Games
                </a>
                <a href="#" class="sidebar-link" data-section="waves">
                    <i class="fas fa-graduation-cap"></i> Student Waves
                </a>
                <a href="#" class="sidebar-link" data-section="gallery">
                    <i class="fas fa-images"></i> Gallery
                </a>
                <a href="#" class="sidebar-link" data-section="site-settings">
                    <i class="fas fa-cog"></i> Site Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/" class="sidebar-link" target="_self">
                    <i class="fas fa-external-link-alt"></i> View Website
                </a>
                <button class="sidebar-link logout-btn" id="admin-logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main" id="admin-main">
            <!-- Sections rendered here dynamically based on active sidebar link -->
        </main>
    </div>

    <!-- Modal for Adding/Editing -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <form id="item-form">
                <h3 id="modal-title">Add Item</h3>
                <div id="form-fields"></div>
                <button type="submit" class="btn-primary">Save</button>
            </form>
        </div>
    </div>

    <!-- Confirmation Modal for Delete Actions -->
    <div id="confirm-modal" class="modal">
        <div class="modal-content">
            <h3>Confirm Deletion</h3>
            <p>Are you sure you want to delete this item? This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="confirm-delete" class="btn-danger">Delete</button>
                <button id="cancel-delete" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/js/main.js?v=1.0"></script>
    <script src="/js/admin.js?v=1.0"></script>
</body>

</html>
